name: Package CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      drift:
        description: Check source and dependency drift
        type: boolean
        default: false
  schedule:
    - cron: '23 5 * * 2'

permissions:
  contents: read

jobs:
  package:
    if: github.event_name != 'schedule' && !inputs.drift
    uses: getpatched/actions/.github/workflows/package-ci.yml@67106330d413dfde3bea2fb1d053b2467dda1e00
    with:
      tooling_ref: 67106330d413dfde3bea2fb1d053b2467dda1e00
  drift:
    name: Drift (${{ matrix.branch }})
    if: github.event_name == 'schedule' || inputs.drift
    strategy:
      fail-fast: false
      matrix:
        branch: ["main", "getpatched/debian-bookworm", "getpatched/debian-trixie"]
    uses: getpatched/actions/.github/workflows/package-ci.yml@9b4592da127d2a84142f0c40fd7ded904b0661f7
    with:
      tooling_ref: 9b4592da127d2a84142f0c40fd7ded904b0661f7
      drift: true
      recipe_ref: refs/heads/${{ matrix.branch }}
