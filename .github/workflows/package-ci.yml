name: Package CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      drift:
        description: Check source and dependency drift
        type: boolean
        default: false
  schedule:
    - cron: '23 5 * * 2'

permissions:
  contents: read

jobs:
  package:
    if: github.event_name != 'schedule' && !inputs.drift
    uses: getpatched/actions/.github/workflows/package-ci.yml@59aebb7a2c70e67cb5af8915ac6734ce997888eb
    with:
      tooling_ref: 59aebb7a2c70e67cb5af8915ac6734ce997888eb
  drift:
    if: github.event_name == 'schedule' || inputs.drift
    uses: getpatched/actions/.github/workflows/package-ci.yml@59aebb7a2c70e67cb5af8915ac6734ce997888eb
    with:
      tooling_ref: 59aebb7a2c70e67cb5af8915ac6734ce997888eb
      drift: true
